<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resilient MPEG-DASH Player</title>
    <style>
        video {
            width: 100%;
            max-width: 800px;
            background-color: #000;
        }
    </style>
</head>
<body>
    <video id="videoPlayer" controls autoplay muted></video>
    <!-- Include the official dash.js library -->
    <script src="https://dashjs.org"></script>
    <script>
        const videoElement = document.querySelector("#videoPlayer");
        const streamUrl = "https://a00.w3gradle.com/a03/live.mpd"; 
        const player = dashjs.MediaPlayer().create();
        player.updateSettings({
            streaming: {
                retryAttempts: {
                    mpd: 999,          // Retry fetching the manifest file 999 times
                    playlist: 999,     // Retry fetching sub-playlists
                    media: 999         // Retry fetching individual video chunks
                },
                retryIntervals: {
                    mpd: 2000,         // Wait 2 seconds before trying the manifest again
                    playlist: 2000,    // Wait 2 seconds for playlists
                    media: 2000        // Wait 2 seconds for media chunks
                }
            }
        });
        player.initialize(videoElement, streamUrl, true);
        player.on(dashjs.MediaPlayer.events.ERROR, function (e) {
            console.warn("Playback error encountered:", e.error);
            if (e.error === 'download' || e.error === 'manifestError') {
                console.log("Source disconnected. Attempting a hard player reset in 5 seconds...");
                setTimeout(() => {
                    player.reset(); 
                    player.initialize(videoElement, streamUrl, true);
                }, 5000); // 5-second delay to give your encoder time to go back online
            }
        });
    </script>
</body>
</html>
