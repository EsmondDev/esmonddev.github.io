<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DASH Player</title>
    <!-- Include the reference implementation dash.js player library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h2 {
            color: #00adb5;
            margin-bottom: 10px;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
        }
        .stream-info {
            background-color: #1e1e1e;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 4px solid #00adb5;
        }
        .info-row {
            margin: 5px 0;
            font-size: 14px;
            word-break: break-all;
        }
        .label {
            font-weight: bold;
            color: #eeeeee;
        }
        .value {
            color: #00adb5;
        }
        #statusLog {
            color: #ff5722;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>MPEG-DASH Web Stream Player</h2>
    
    <!-- Video Player Element -->
    <div class="player-wrapper">
        <video id="videoPlayer" controls autoplay muted></video>
    </div>

    <!-- Live Stream Diagnostics -->
    <div class="stream-info">
        <div class="info-row">
            <span class="label">Stream URL:</span> 
            <span class="value" id="streamUrl"></span>
        </div>
        <div class="info-row">
            <span class="label">Playback Status:</span> 
            <span class="value" id="statusLog">Initializing...</span>
        </div>
        <div class="info-row">
            <span class="label">Buffer Length:</span> 
            <span class="value" id="bufferValue">0</span> seconds
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Target stream configuration
        const targetStreamUrl = "https://a00.w3gradle.com/a03/live.mpd";
        
        // Update UI info block
        document.getElementById("streamUrl").textContent = targetStreamUrl;

        const videoElement = document.querySelector("#videoPlayer");
        const statusLog = document.getElementById("statusLog");
        const bufferValue = document.getElementById("bufferValue");

        // Instantiate dash.js player setup
        const player = dashjs.MediaPlayer().create();
        
        // Initialize player context
        player.initialize(videoElement, targetStreamUrl, true);

        // Event: Stream Engine Ready
        player.on(dashjs.MediaPlayer.events.CAN_PLAY, function() {
            statusLog.textContent = "Streaming Live";
            statusLog.style.color = "#4caf50";
        });

        // Event: Error Catching
        player.on(dashjs.MediaPlayer.events.ERROR, function(e) {
            statusLog.textContent = "Error: " + (e.error ? e.error.message : "Failed to load manifest");
            statusLog.style.color = "#f44336";
            console.error("DASH Player Error:", e);
        });

        // Live Diagnostic Metric Loop: Track Live Buffer Depth
        setInterval(() => {
            if (player.isReady()) {
                const currentBuffer = player.getBufferLength('video');
                bufferValue.textContent = currentBuffer.toFixed(2);
            }
        }, 1000);
    });
</script>

</body>
</html>
