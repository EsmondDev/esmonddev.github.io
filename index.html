<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH Stream Player with DOM Hard Reset</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .video-container {
            width: 100%;
            max-width: 960px;
            position: relative;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000000;
        }

        #status-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(20, 20, 20, 0.85);
            color: #ffcc00;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        #unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 20;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.2s;
        }

        #unmute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>

<div class="video-container" id="playerWrapper">
    <video id="videoPlayer" controls autoplay playsinline></video>
    <div id="status-overlay">Reconnecting to stream...</div>
    <button id="unmute-btn">🔊 Click to Unmute</button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var baseUrl = "https://a00.w3gradle.com/a03/live.mpd";
        var playerWrapper = document.getElementById("playerWrapper");
        var statusOverlay = document.getElementById("status-overlay");
        var unmuteBtn = document.getElementById("unmute-btn");
        var videoElement = document.getElementById("videoPlayer");

        var player = null;
        var isReconnecting = false;
        var reconnectTimer = null;

        function showStatus(text) {
            statusOverlay.innerText = text;
            statusOverlay.style.display = "block";
        }

        function hideStatus() {
            statusOverlay.style.display = "none";
        }

        function startPlayback() {
            videoElement.play().then(function() {
                unmuteBtn.style.display = "none";
            }).catch(function(error) {
                videoElement.muted = true;
                videoElement.play();
                unmuteBtn.style.display = "block";
            });
        }

        unmuteBtn.addEventListener("click", function() {
            videoElement.muted = false;
            unmuteBtn.style.display = "none";
        });

        // Hard recreates the <video> DOM element to flush browser MediaSource memory
        function recreateVideoElement() {
            var oldVideo = document.getElementById("videoPlayer");
            if (oldVideo) {
                oldVideo.pause();
                oldVideo.removeAttribute("src");
                oldVideo.load(); // Forces MSE cleanup in modern browsers
                oldVideo.remove();
            }

            var newVideo = document.createElement("video");
            newVideo.id = "videoPlayer";
            newVideo.controls = true;
            newVideo.autoplay = true;
            newVideo.playsInline = true;
            
            // Insert video before overlays
            playerWrapper.insertBefore(newVideo, statusOverlay);
            videoElement = newVideo;
        }

        function initPlayer() {
            if (player) {
                try { player.destroy(); } catch(e) {}
            }

            player = dashjs.MediaPlayer().create();
            
            player.updateSettings({
                streaming: {
                    retryIntervals: { MPD: 1000, XHR: 1000 },
                    retryAttempts: { MPD: 0, XHR: 2 },
                    lowLatencyEnabled: true,
                    jumpGaps: true
                }
            });

            player.setAutoPlay(true);
            attachEvents(player);

            // Append timestamp to url to bypass HTTP cache on reconnect
            var cacheBustingUrl = baseUrl + "?t=" + new Date().getTime();
            player.initialize(videoElement, cacheBustingUrl, true);
        }

        function attemptReconnect() {
            if (isReconnecting) return;
            isReconnecting = true;

            showStatus("Encoder reset detected. Reconnecting...");

            if (reconnectTimer) clearInterval(reconnectTimer);

            reconnectTimer = setInterval(function () {
                console.log("Re-creating DOM element and reconnecting...");
                recreateVideoElement();
                initPlayer();
            }, 3000);
        }

        function attachEvents(playerInstance) {
            playerInstance.on(dashjs.MediaPlayer.events.ERROR, function (e) {
                console.warn("DASH Error encountered:", e);
                attemptReconnect();
            });

            playerInstance.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
                if (isReconnecting) {
                    console.log("Stream recovered successfully!");
                    isReconnecting = false;
                    clearInterval(reconnectTimer);
                    hideStatus();
                }
                
                startPlayback();
            });
        }

        // First initialization
        initPlayer();
    });
</script>

</body>
</html>
