<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH Stream Player with Hard Reconnect</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .video-container {
            width: 100%;
            max-width: 960px;
            position: relative;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000000;
        }

        #status-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(20, 20, 20, 0.85);
            color: #ffcc00;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        #unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 20;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.2s;
        }

        #unmute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>

<div class="video-container">
    <video id="videoPlayer" controls autoplay playsinline></video>
    <div id="status-overlay">Reconnecting to stream...</div>
    <button id="unmute-btn">🔊 Click to Unmute</button>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var baseUrl = "https://a00.w3gradle.com/a03/live.mpd";
        var videoElement = document.querySelector("#videoPlayer");
        var statusOverlay = document.querySelector("#status-overlay");
        var unmuteBtn = document.querySelector("#unmute-btn");

        var player = dashjs.MediaPlayer().create();

        function applyPlayerSettings(p) {
            p.updateSettings({
                streaming: {
                    retryIntervals: { MPD: 2000, XHR: 2000 },
                    retryAttempts: { MPD: 0, XHR: 3 },
                    lowLatencyEnabled: true,
                    // Jump straight to the live edge when re-initialized
                    liveDelay: 3,
                    jumpGaps: true
                }
            });
            p.setAutoPlay(true);
        }

        applyPlayerSettings(player);
        player.initialize(videoElement, baseUrl, true);
        videoElement.muted = false;

        function startPlayback() {
            videoElement.play().then(function() {
                unmuteBtn.style.display = "none";
            }).catch(function(error) {
                videoElement.muted = true;
                videoElement.play();
                unmuteBtn.style.display = "block";
            });
        }

        unmuteBtn.addEventListener("click", function() {
            videoElement.muted = false;
            unmuteBtn.style.display = "none";
        });

        var isReconnecting = false;
        var reconnectTimer = null;

        function showStatus(text) {
            statusOverlay.innerText = text;
            statusOverlay.style.display = "block";
        }

        function hideStatus() {
            statusOverlay.style.display = "none";
        }

        function attemptReconnect() {
            if (isReconnecting) return;
            isReconnecting = true;

            showStatus("Encoder restarted. Reconnecting...");

            if (reconnectTimer) clearInterval(reconnectTimer);

            reconnectTimer = setInterval(function () {
                console.log("Hard resetting player and purging cache...");
                
                // 1. Completely destroy the current player state and detach media element
                player.destroy();
                player = dashjs.MediaPlayer().create();
                
                applyPlayerSettings(player);
                attachEvents(player);

                // 2. Append timestamp cache-buster so browser doesn't load old manifest file
                var cacheBusterUrl = baseUrl + "?t=" + new Date().getTime();
                
                player.initialize(videoElement, cacheBusterUrl, true);
            }, 4000);
        }

        function attachEvents(playerInstance) {
            playerInstance.on(dashjs.MediaPlayer.events.ERROR, function (e) {
                console.warn("DASH Error encountered:", e);
                attemptReconnect();
            });

            playerInstance.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
                if (isReconnecting) {
                    console.log("Stream recovered successfully!");
                    isReconnecting = false;
                    clearInterval(reconnectTimer);
                    hideStatus();

                    // Force seek to the latest live edge on new timeline
                    var livePosition = playerInstance.getDuration();
                    if (livePosition && !isNaN(livePosition)) {
                        playerInstance.seek(livePosition);
                    }
                }
                
                startPlayback();
            });
        }

        attachEvents(player);
    });
</script>

</body>
</html>
