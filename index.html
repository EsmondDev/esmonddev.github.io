<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>w3Engine Player</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .video-container {
            width: 100%;
            max-width: 960px;
            position: relative;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000000;
        }
        #status-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(20, 20, 20, 0.85);
            color: #ffcc00;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        #unmute-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: none;
            z-index: 20;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, background 0.2s;
        }
        #unmute-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>
<div class="video-container">
    <video id="videoPlayer" controls autoplay playsinline></video>
    <div id="status-overlay">Reconnecting to stream...</div>
    <button id="unmute-btn">🔊 Click to Unmute</button>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        var url = "https://a00.w3gradle.com/a03/live.mpd";
        var videoElement = document.querySelector("#videoPlayer");
        var statusOverlay = document.querySelector("#status-overlay");
        var unmuteBtn = document.querySelector("#unmute-btn");
        var player = dashjs.MediaPlayer().create();
        player.updateSettings({
            streaming: {
                retryIntervals: { MPD: 2000, XHR: 2000 },
                retryAttempts: { MPD: 0, XHR: 5 },
                lowLatencyEnabled: true
            }
        });
        player.setAutoPlay(true);
        player.initialize(videoElement, url, true);
        videoElement.muted = false;
        function startPlayback() {
            videoElement.play().then(function() {
                unmuteBtn.style.display = "none";
            }).catch(function(error) {
                console.warn("Unmuted autoplay blocked by browser policy. Falling back to muted autoplay.");
                videoElement.muted = true;
                videoElement.play();
                unmuteBtn.style.display = "block";
            });
        }
        unmuteBtn.addEventListener("click", function() {
            videoElement.muted = false;
            unmuteBtn.style.display = "none";
        });
        var isReconnecting = false;
        var reconnectTimer = null;
        function showStatus(text) {
            statusOverlay.innerText = text;
            statusOverlay.style.display = "block";
        }
        function hideStatus() {
            statusOverlay.style.display = "none";
        }
        function attemptReconnect() {
            if (isReconnecting) return;
            isReconnecting = true;
            showStatus("Stream disconnected. Attempting to reconnect...");
            if (reconnectTimer) clearInterval(reconnectTimer);
            reconnectTimer = setInterval(function () {
                console.log("Attempting to reload stream...");
                player.reset();
                player = dashjs.MediaPlayer().create();
                player.updateSettings({
                    streaming: {
                        retryIntervals: { MPD: 2000, XHR: 2000 },
                        retryAttempts: { MPD: 0, XHR: 5 }
                    }
                });
                player.setAutoPlay(true);
                attachEvents(player);
                player.initialize(videoElement, url, true);
                startPlayback();
            }, 5000);
        }
        function attachEvents(playerInstance) {
            playerInstance.on(dashjs.MediaPlayer.events.ERROR, function (e) {
                console.warn("DASH Error encountered:", e);
                attemptReconnect();
            });
            playerInstance.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
                if (isReconnecting) {
                    console.log("Stream reconnected successfully!");
                    isReconnecting = false;
                    clearInterval(reconnectTimer);
                    hideStatus();
                }
                startPlayback();
            });
        }
        attachEvents(player);
    });
</script>
</body>
</html>
