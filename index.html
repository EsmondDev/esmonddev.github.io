<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web DASH Live Stream Dashboard</title>
    <!-- Fixed: Import official dash.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            margin-bottom: 20px;
            border-bottom: 1px solid #2d2d2d;
            padding-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #00adb5;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .dashboard {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .metric-card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #00adb5;
        }
        .metric-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
        }
        .stream-url-box {
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 15px;
            word-break: break-all;
            color: #888;
        }
        .stream-url-box span {
            color: #00adb5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DASH Stream Dashboard</h1>
    </header>

    <div class="stream-url-box">
        <strong>Source Stream:</strong> <span>https://a00.w3gradle.com/a03/live.mpd</span>
    </div>

    <div class="video-wrapper">
        <video id="videoPlayer" controls></video>
    </div>

    <div class="dashboard">
        <div class="metric-card">
            <div class="metric-label">Buffer Level</div>
            <div id="bufferLevel" class="metric-value">0.00 s</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Current Bitrate</div>
            <div id="currentBitrate" class="metric-value">0 Kbps</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Resolution</div>
            <div id="videoResolution" class="metric-value">0 x 0</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Dropped Frames</div>
            <div id="droppedFrames" class="metric-value">0</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const streamUrl = "https://a00.w3gradle.com/a03/live.mpd";
        const videoElement = document.querySelector("#videoPlayer");
        
        // Initialize the dash.js MediaPlayer instance
        const player = dashjs.MediaPlayer().create();
        
        // Configuration optimizations for live streaming stability
        player.updateSettings({
            streaming: {
                lowLatencyEnabled: true,
                liveDelay: 3,
                fastSwitchEnabled: true
            }
        });

        // Bind video element view and attach the manifest stream source
        player.initialize(videoElement, streamUrl, true);

        // Telemetry loop querying metrics dynamically every half second
        setInterval(function () {
            if (player.isReady()) {
                // 1. Get current buffer length safely
                const bufferInfo = player.getBufferLength('video');
                if (bufferInfo !== null && bufferInfo !== undefined) {
                    document.getElementById('bufferLevel').innerText = bufferInfo.toFixed(2) + " s";
                }

                // 2. Get active stream info metrics with optional chaining / null checks
                const activeStream = player.getActiveStream();
                if (activeStream) {
                    const videoTrack = activeStream.getBitrateListFor('video');
                    const currentIndex = player.getQualityFor('video');
                    
                    if (videoTrack && videoTrack[currentIndex]) {
                        const currentTrack = videoTrack[currentIndex];
                        const bitrateKbps = Math.round(currentTrack.bitrate / 1000);
                        document.getElementById('currentBitrate').innerText = bitrateKbps + " Kbps";
                        document.getElementById('videoResolution').innerText = `${currentTrack.width} x ${currentTrack.height}`;
                    }
                }

                // 3. Collect dropped playback frame data metrics safely
                const videoPlaybackQuality = videoElement.getVideoPlaybackQuality ? 
                    videoElement.getVideoPlaybackQuality() : null;
                
                if (videoPlaybackQuality) {
                    document.getElementById('droppedFrames').innerText = videoPlaybackQuality.droppedVideoFrames;
                }
            }
        }, 500);
    });
</script>

</body>
</html>
