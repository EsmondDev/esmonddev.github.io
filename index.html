<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DASH Stream Player with Auto-Reconnect</title>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <style>
        /* Dark Page Background */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .video-container {
            width: 100%;
            max-width: 960px;
            position: relative;
            background: #000000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: #000000;
        }

        /* Status Badge Overlay */
        #status-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(20, 20, 20, 0.85);
            color: #ffcc00;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            display: none;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="video-container">
    <!-- autoplay, muted, and playsinline are required for seamless browser autoplay -->
    <video id="videoPlayer" controls autoplay muted playsinline></video>
    <div id="status-overlay">Reconnecting to stream...</div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var url = "https://a00.w3gradle.com/a03/live.mpd";
        var videoElement = document.querySelector("#videoPlayer");
        var statusOverlay = document.querySelector("#status-overlay");

        var player = dashjs.MediaPlayer().create();

        // 1. Configure settings for built-in retries and immediate playback
        player.updateSettings({
            streaming: {
                retryIntervals: {
                    MPD: 2000,          // Retry fetching manifest every 2s
                    XHR: 2000           // Retry chunk requests every 2s
                },
                retryAttempts: {
                    MPD: 0,             // Infinite retries for manifest
                    XHR: 5
                },
                lowLatencyEnabled: true
            }
        });

        // Enable auto-play behavior inside dash.js options
        player.setAutoPlay(true);

        // Initialize player with autoPlay parameter = true
        player.initialize(videoElement, url, true);

        var isReconnecting = false;
        var reconnectTimer = null;

        function showStatus(text) {
            statusOverlay.innerText = text;
            statusOverlay.style.display = "block";
        }

        function hideStatus() {
            statusOverlay.style.display = "none";
        }

        function attemptReconnect() {
            if (isReconnecting) return;
            isReconnecting = true;

            showStatus("Stream disconnected. Attempting to reconnect...");

            if (reconnectTimer) clearInterval(reconnectTimer);

            reconnectTimer = setInterval(function () {
                console.log("Attempting to reload stream...");
                
                player.reset();
                player = dashjs.MediaPlayer().create();
                
                player.updateSettings({
                    streaming: {
                        retryIntervals: { MPD: 2000, XHR: 2000 },
                        retryAttempts: { MPD: 0, XHR: 5 }
                    }
                });

                player.setAutoPlay(true);
                attachEvents(player);
                player.initialize(videoElement, url, true);
                
                // Force play command after re-initialization
                videoElement.play().catch(function(err) {
                    console.log("Autoplay waiting for user interaction:", err);
                });
            }, 5000);
        }

        function attachEvents(playerInstance) {
            playerInstance.on(dashjs.MediaPlayer.events.ERROR, function (e) {
                console.warn("DASH Error encountered:", e);
                attemptReconnect();
            });

            playerInstance.on(dashjs.MediaPlayer.events.STREAM_INITIALIZED, function () {
                if (isReconnecting) {
                    console.log("Stream reconnected successfully!");
                    isReconnecting = false;
                    clearInterval(reconnectTimer);
                    hideStatus();
                }
                
                // Trigger play when initialized
                videoElement.play().catch(function(e) {
                    console.log("Autoplay blocked by browser policy:", e);
                });
            });
        }

        attachEvents(player);
    });
</script>

</body>
</html>
