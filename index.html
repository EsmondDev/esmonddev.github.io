<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Music TV Live</title>
    <!-- Include official dash.js library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        header {
            margin-bottom: 20px;
            border-bottom: 1px solid #331010;
            padding-bottom: 10px;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #ff4500; /* Red-Orange Header */
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.2);
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* Round Play Button - Red background, Yellow icon on hover */
        .play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: rgba(220, 20, 60, 0.9); /* Crimson Red */
            border: 2px solid #ff8c00; /* Dark Orange Border */
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(220, 20, 60, 0.5);
            transition: transform 0.2s ease, background-color 0.2s ease, opacity 0.3s ease;
            z-index: 10;
        }
        .play-btn:hover {
            background-color: #ff4500; /* Bright Orange-Red */
            transform: translate(-50%, -50%) scale(1.1);
        }
        /* Triangle Play Icon */
        .play-btn::after {
            content: "";
            display: block;
            width: 0;
            height: 0;
            margin-left: 5px;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #ffd700; /* Gold Yellow Icon */
        }
        .play-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .dashboard {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .metric-card {
            background-color: #1e1e1e;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #ff8c00; /* Dark Orange Border Accent */
        }
        .metric-label {
            font-size: 0.85rem;
            color: #ffae42; /* Soft Warm Yellow */
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .metric-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffd700; /* Gold Yellow Value */
        }
        .stream-url-box {
            background-color: #1e1e1e;
            padding: 10px 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 15px;
            word-break: break-all;
            color: #888;
        }
        .stream-url-box span {
            color: #ff4500; /* Orange-Red URL Accent */
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DASH Stream Dashboard</h1>
    </header>

    <div class="stream-url-box">
        <strong>Source Stream:</strong> <span>https://a00.w3gradle.com/a03/live.mpd</span>
    </div>

    <div class="video-wrapper">
        <video id="videoPlayer" controls></video>
        <button id="customPlayBtn" class="play-btn" aria-label="Play"></button>
    </div>

    <div class="dashboard">
        <div class="metric-card">
            <div class="metric-label">Buffer Level</div>
            <div id="bufferLevel" class="metric-value">0.00 s</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Current Bitrate</div>
            <div id="currentBitrate" class="metric-value">0 Kbps</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Resolution</div>
            <div id="videoResolution" class="metric-value">0 x 0</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Dropped Frames</div>
            <div id="droppedFrames" class="metric-value">0</div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const streamUrl = "https://a00.w3gradle.com/a03/live.mpd";
        const videoElement = document.querySelector("#videoPlayer");
        const playBtn = document.querySelector("#customPlayBtn");
        
        const player = dashjs.MediaPlayer().create();
        
        player.updateSettings({
            streaming: {
                lowLatencyEnabled: true,
                liveDelay: 3,
                fastSwitchEnabled: true
            }
        });

        player.initialize(videoElement, streamUrl, false);

        playBtn.addEventListener("click", function () {
            videoElement.play();
        });

        videoElement.addEventListener("play", function () {
            playBtn.classList.add("hidden");
        });

        videoElement.addEventListener("pause", function () {
            playBtn.classList.remove("hidden");
        });

        setInterval(function () {
            if (player.isReady()) {
                const bufferInfo = player.getBufferLength('video');
                if (bufferInfo !== null && bufferInfo !== undefined) {
                    document.getElementById('bufferLevel').innerText = bufferInfo.toFixed(2) + " s";
                }

                const activeStream = player.getActiveStream();
                if (activeStream) {
                    const videoTrack = activeStream.getBitrateListFor('video');
                    const currentIndex = player.getQualityFor('video');
                    
                    if (videoTrack && videoTrack[currentIndex]) {
                        const currentTrack = videoTrack[currentIndex];
                        const bitrateKbps = Math.round(currentTrack.bitrate / 1000);
                        document.getElementById('currentBitrate').innerText = bitrateKbps + " Kbps";
                        document.getElementById('videoResolution').innerText = `${currentTrack.width} x ${currentTrack.height}`;
                    }
                }

                const videoPlaybackQuality = videoElement.getVideoPlaybackQuality ? 
                    videoElement.getVideoPlaybackQuality() : null;
                
                if (videoPlaybackQuality) {
                    document.getElementById('droppedFrames').innerText = videoPlaybackQuality.droppedVideoFrames;
                }
            }
        }, 500);
    });
</script>

</body>
</html>
